    <script>
        
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 260; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2.2 + 0.6,
                speed: Math.random() * 0.6 + 0.15,
                opacity: Math.random() * 0.8 + 0.2,
                twinkle: Math.random() * 0.02 + 0.005
            });
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.y -= s.speed;
                if (s.y < -5) {
                    s.y = canvas.height + 5;
                    s.x = Math.random() * canvas.width;
                }
                s.opacity += s.twinkle * (Math.random() > 0.5 ? 1 : -1);
                if (s.opacity > 1) s.opacity = 1;
                if (s.opacity < 0.1) s.opacity = 0.1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(0, 255, 65, ${s.opacity * 0.6})`;
                ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }
        drawStars();

        
        function handleLogin() {
            if (!document.getElementById('loginUser').value.trim() || !document.getElementById('loginPass').value.trim()) return;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
        }

        function handleLogout() {
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }

            document.getElementById('outputLua').value = output;

        function copyOutput() {
            const output = document.getElementById('outputLua');
            if (!output.value.trim()) return;
            output.select();

    </script>
