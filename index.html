<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX - Roblox Lua Shield (Ultra)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #stars-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(6px);
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #loginScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-box {
            background: linear-gradient(145deg, #0a0a0a, #1a1a1a);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
            padding: 50px 40px 40px; width: 420px; max-width: 92%;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 0 80px rgba(0, 210, 106, 0.06), inset 0 0 60px rgba(255, 255, 255, 0.02);
        }
        .login-box::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 26px; z-index: -1;
            background: linear-gradient(45deg, #00d26a, transparent, #00d26a, transparent);
            background-size: 400% 400%; animation: borderGlow 6s linear infinite; opacity: 0.4;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-logo-img {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(0, 210, 106, 0.3); margin-bottom: 12px;
        }
        .login-brand {
            font-size: 48px; font-weight: 900; letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff, #00d26a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .login-sub {
            font-size: 13px; color: rgba(255, 255, 255, 0.35); letter-spacing: 6px;
            text-transform: uppercase; margin-bottom: 28px; font-weight: 300;
        }
        .login-box input {
            width: 100%; padding: 14px 18px; margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; color: #fff; font-size: 14px; direction: ltr; text-align: left;
            outline: none; transition: border-color 0.3s;
        }
        .login-box input:focus { border-color: #00d26a; }
        .login-btn, button {
            background: linear-gradient(135deg, #00d26a, #00994d); color: #000;
            font-weight: 800; font-size: 16px; border: none; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease;
        }
        .login-btn { width: 100%; padding: 14px; margin-top: 6px; letter-spacing: 2px; }
        .login-btn:hover, button:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 210, 106, 0.3); }
        #mainApp {
            position: relative; z-index: 1; display: none; min-height: 100vh; padding: 30px 20px;
        }
        #mainApp.active { display: flex; justify-content: center; align-items: flex-start; }
        .container {
            width: 100%; max-width: 860px; background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(12px); padding: 35px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05); margin-top: 30px;
        }
        .header-brand { text-align: center; margin-bottom: 30px; }
        .header-brand .logo-text {
            font-size: 42px; font-weight: 900; letter-spacing: 8px;
            background: linear-gradient(135deg, #ffffff, #00d26a);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-brand .sub-text { font-size: 13px; color: rgba(255, 255, 255, 0.25); letter-spacing: 4px; }
        h2 { text-align: center; margin-bottom: 22px; color: #00d26a; font-size: 22px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: rgba(255, 255, 255, 0.7); }
        textarea {
            width: 100%; height: 200px; background: rgba(0, 0, 0, 0.7); color: #38bdf8;
            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px; padding: 14px;
            font-family: monospace; font-size: 13px; resize: vertical; direction: ltr;
            text-align: left; outline: none; transition: border-color 0.3s;
        }
        textarea:focus { border-color: rgba(0, 210, 106, 0.3); }
        .btn-container { text-align: center; margin: 22px 0; }
        button { padding: 14px 34px; letter-spacing: 1px; }
        .copy-btn {
            background: rgba(255, 255, 255, 0.06); color: #fff; font-size: 14px;
            padding: 10px 20px; margin-top: 12px; float: left;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.12); box-shadow: none; }
        .logout-btn {
            position: fixed; top: 20px; left: 20px; z-index: 20;
            background: rgba(255, 255, 255, 0.04); color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06); padding: 8px 18px;
            font-size: 12px; border-radius: 8px; font-weight: 400;
        }
        .logout-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
        .status-badge { text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.2); margin-top: 20px; letter-spacing: 2px; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div id="loginScreen">
        <div class="login-box">
            <img class="login-logo-img" src="https://github.com/Rxz60/MRX/raw/refs/heads/main/IMG_4528.jpeg" alt="MRX Logo">
            <div class="login-brand">MRX</div>
            <div class="login-sub">● Roblox Security ●</div>
            <input type="text" id="loginUser" placeholder="اسم المستخدم (MRX.com)" autocomplete="off">
            <button class="login-btn" onclick="handleLogin()">دخول ➤</button>
        </div>
    </div>
    <div id="mainApp">
        <button class="logout-btn" onclick="handleLogout()">✕ خروج</button>
        <div class="container">
            <div class="header-brand">
                <div class="logo-text">MRX</div>
                <div class="sub-text">● ULTRA SHIELD — OBFUSCATOR ●</div>
            </div>
            <h2>⎜ تشفير لا يُفك – يعمل في Roblox ⎜</h2>
            <label for="inputLua">أدخل كود Lua الأصلي (Roblox):</label>
            <textarea id="inputLua" placeholder='print("Hello Roblox!")'></textarea>
            <div class="btn-container">
                <button onclick="obfuscateScript()">🔒 تشفير فائق — MRX SHIELD ULTRA</button>
            </div>
            <label for="outputLua">الكود المُعمَّى (جاهز للتشغيل):</label>
            <textarea id="outputLua" readonly placeholder="سيظهر هنا كود مشفر بثلاث طبقات..."></textarea>
            <div style="text-align: left;">
                <button class="copy-btn" onclick="copyOutput()">📋 نسخ الكود المشفر</button>
            </div>
            <div class="status-badge">MRX ULTRA SHIELD v5.0 ● ENCRYPTION: 3-LAYER + CHAOS ● UNAUTHORIZED DECRYPTION IMPOSSIBLE</div>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 260; i++) {
            stars.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 2.2 + 0.6, speed: Math.random() * 0.6 + 0.15,
                opacity: Math.random() * 0.8 + 0.2, twinkle: Math.random() * 0.02 + 0.005
            });
        }
        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.y -= s.speed;
                if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
                s.opacity += s.twinkle * (Math.random() > 0.5 ? 1 : -1);
                if (s.opacity > 1) s.opacity = 1; if (s.opacity < 0.1) s.opacity = 0.1;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`; ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }
        drawStars();

        function handleLogin() {
            if (!document.getElementById('loginUser').value.trim()) return;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
        }

        function handleLogout() {
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
        }

        function obfuscateScript() {
            const raw = document.getElementById('inputLua').value;
            if (!raw.trim()) return;
            const bytes = [];
            for (let i = 0; i < raw.length; i++) bytes.push(raw.charCodeAt(i));
            const K1 = Math.floor(Math.random() * 250) + 5;
            const K2 = Math.floor(Math.random() * 250) + 5;
            const K3 = Math.floor(Math.random() * 250) + 5;
            let layer1 = bytes.map(b => b ^ K1);
            let layer2 = layer1.map(b => b ^ K2);
            let layer3 = layer2.map(b => b ^ K3);
            const indices = [];
            for (let i = 0; i < layer3.length; i++) indices.push(i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            const shuffledData = [];
            const shuffleMap = [];
            for (let i = 0; i < layer3.length; i++) {
                shuffledData.push(layer3[indices[i]]);
                shuffleMap.push(indices[i]);
            }
            const dummyCount = Math.floor(Math.random() * 10) + 5;
            for (let i = 0; i < dummyCount; i++) {
                shuffledData.push(Math.floor(Math.random() * 256));
                shuffleMap.push(-1);
            }
            let code = `-- MRX ULTRA SHIELD - ROBLOX LUA\n`;
            code += `local _K1 = ${K1}\n`;
            code += `local _K2 = ${K2}\n`;
            code += `local _K3 = ${K3}\n`;
            code += `local _map = {${shuffleMap.join(',')}}\n`;
            code += `local _data = {${shuffledData.join(',')}}\n`;
            code += `local _len = #_data\n`;
            code += `local _restore = {}\n`;
            code += `for i=1,_len do\n`;
            code += `    local idx = _map[i]\n`;
            code += `    if idx >= 0 then _restore[idx+1] = _data[i] end\n`;
            code += `end\n`;
            code += `local _dec = {}\n`;
            code += `for i=1,#_restore do\n`;
            code += `    local b = _restore[i]\n`;
            code += `    b = bit32.bxor(b, _K3)\n`;
            code += `    b = bit32.bxor(b, _K2)\n`;
            code += `    b = bit32.bxor(b, _K1)\n`;
            code += `    _dec[i] = b\n`;
            code += `end\n`;
            code += `local _chars = {}\n`;
            code += `for i=1,#_dec do _chars[i] = string.char(_dec[i]) end\n`;
            code += `local _script = table.concat(_chars)\n`;
            code += `local _func, _err = loadstring(_script)\n`;
            code += `if _func then return _func() else error(_err) end\n`;
            document.getElementById('outputLua').value = code;
        }

        function copyOutput() {
            const output = document.getElementById('outputLua');
            if (!output.value.trim()) return;
            output.select(); output.setSelectionRange(0, 99999);
            document.execCommand('copy');
        }
    </script>
</body>
</html>
